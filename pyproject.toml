[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# E501 is off because the formatter owns line length.
# B008 is off because FastAPI's Depends()/File() defaults are the documented API.
# B904/B023/B007 produce noise in this codebase's error-handling style.
ignore = ["E501", "B008", "B904", "B023", "B007"]

exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into private helpers to pin regressions.
"backend/tests/**" = ["SLF001"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
# The backend is imported as `src.*` (pythonpath points at backend/), so it must
# be declared explicitly or isort files it under third-party.
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "slow: takes more than a second",
    "requires_docker: needs a reachable Docker daemon (skipped in CI)",
    "requires_llm: needs a reachable model server (skipped in CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["backend/src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Mutation testing config is cosmic-ray.toml at the repo root, not here -- cosmic-ray reads
# its own [cosmic-ray] TOML file rather than a [tool.*] table. See
# docs/analysis/mutation-testing.md.
