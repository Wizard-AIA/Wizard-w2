name: Performance & Latency Benchmarks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Arrow IPC & AST CodeGuard Performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt -r requirements-local.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Run Throughput and Latency Benchmarks
        run: |
          pytest backend/tests/stress/test_performance_benchmarks.py -v -s

      - name: Verify reviewed analytical benchmark baseline
        run: |
          pytest backend/tests/benchmark backend/tests/unit/test_benchmark_baseline.py -v
          python scripts/check_benchmark_drift.py
