name: Packaging rehearsal (temporary, delete before merge)

# Runs the release workflow's Homebrew and Scoop verification against archives
# built from this branch, before any tag exists.

on:
  push:
    branches: [Aniket-a14/release-v1-0-13-dadaca79]
    paths: [.github/workflows/brew-rehearsal.yml]

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0.13

jobs:
  build:
    name: Build and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: scripts/build_release.sh "$RELEASE_TAG"
      - run: python3 scripts/release.py render --version 1.0.13 --sums dist/SHA256SUMS --out packaging-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rehearsal
          path: |
            dist/*.zip
            dist/SHA256SUMS
            packaging-out/*

  brew:
    name: brew rehearsal (${{ matrix.runner }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: rehearsal
          path: .
      - name: Homebrew audit, install, test, uninstall (file mirror)
        shell: bash
        run: |
          set -eu
          if ! command -v brew >/dev/null 2>&1; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1
          brew tap-new --no-git local/verify
          tap="$(brew --repository local/verify)"
          mirror="file://$PWD/dist/"
          # Homebrew infers a version from a github.com release URL but from a bare
          # file name ("Wizard-v1.0.13-darwin-arm64") it would read "64", so the
          # mirrored copy states the version explicitly.
          sed "s|https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/|$mirror|g" packaging-out/wizard.rb \
            | awk -v v="${RELEASE_TAG#v}" '/^  license /{ print "  version \"" v "\"" } { print }' > "$tap/Formula/wizard.rb"
          brew trust local/verify 2>/dev/null || true
          brew audit --strict --formula local/verify/wizard
          brew install --formula local/verify/wizard
          grep -q "$RELEASE_TAG" <<< "$(wizard --version 2>&1)"
          grep -q Usage <<< "$(wizard --help 2>&1)"
          ls -la "$(brew --prefix wizard)/libexec" | head
          brew test local/verify/wizard
          out="$(wizard doctor 2>&1 || true)"; echo "$out" | head -8
          grep -q Homebrew <<< "$out"
          brew uninstall wizard

  scoop:
    name: scoop rehearsal (windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: rehearsal
          path: .
      - name: Scoop install from a local http mirror
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force "mirror/releases/download/$tag" | Out-Null
          Copy-Item dist/*.zip, dist/SHA256SUMS "mirror/releases/download/$tag/"
          Start-Process python -ArgumentList '-m', 'http.server', '8766', '--bind', '127.0.0.1', '--directory', 'mirror' -WindowStyle Hidden
          Start-Sleep 3
          $manifest = Get-Content packaging-out/wizard.json -Raw | ConvertFrom-Json
          $manifest.architecture.'64bit'.url = "http://127.0.0.1:8766/releases/download/$tag/Wizard-$tag-windows-amd64.zip"
          # Scoop names the app after the manifest file, and Wizard's install-kind
          # detection looks for scoop\apps\wizard, so the file must be wizard.json.
          New-Item -ItemType Directory -Force local | Out-Null
          $manifest | ConvertTo-Json -Depth 10 | Set-Content local/wizard.json -Encoding utf8
          Invoke-RestMethod get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          $env:PATH += ";$env:USERPROFILE\scoop\shims"
          scoop install .\local\wizard.json
          $v = wizard --version
          Write-Host $v
          if ($v -notmatch [regex]::Escape($tag)) { throw "reported '$v'" }
          $doctor = (wizard doctor 2>&1 | Out-String)
          Write-Host $doctor
          if ($doctor -notmatch 'Scoop') { throw 'wizard doctor did not recognise a Scoop install' }
          $uninstall = (wizard uninstall --yes 2>&1 | Out-String)
          Write-Host $uninstall
          if ($uninstall -notmatch 'scoop uninstall wizard') { throw 'wizard uninstall did not point at scoop' }
          scoop uninstall wizard
