name: 'Close Stale Issues and PRs'

on:
  schedule:
    - cron: '30 1 * * *' # Every day at 01:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    # `actions/stale` only labels/comments/closes issues and PRs -- it never
    # touches repository contents (there is no checkout step here), so
    # `contents: write` at the old top level was more than this job ever used.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions.'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions.'
          stale-issue-label: 'status:stale'
          stale-pr-label: 'status:stale'
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: 'status:blocked,type:feature'
          exempt-pr-labels: 'status:blocked,type:feature'
