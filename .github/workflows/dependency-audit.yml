name: Dependency Audit

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    # Advisories are published continuously, so re-check even when nothing changes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install Safety
        # Hash-pinned separately from the app's own lock (requirements-audit-tools.in):
        # this job never installs requirements.lock.txt, so constraining safety
        # against it would only produce a spurious conflict over typer's version.
        run: uv pip install --system --require-hashes -r requirements-audit-tools.lock.txt

      - name: Scan runtime dependencies
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: safety scan --file requirements.txt --fail-on unignored

  node-audit:
    name: Node.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate: anything that reaches a user's browser must be clean.
      - name: Audit shipped dependencies
        run: pnpm audit --prod --audit-level=high

      # Reported, not blocking. The remaining advisories are all dev-only and
      # currently unresolvable: the patched brace-expansion (>=5.0.8) changed its
      # export shape and breaks the minimatch bundled by the eslint plugins, so
      # applying the "fix" turns one advisory into fifteen and stops eslint from
      # running at all. Build tooling is not an end-user attack surface, and
      # blocking merges on an upstream conflict we cannot resolve would only
      # train people to ignore this job.
      - name: Audit build tooling (informational)
        continue-on-error: true
        run: pnpm audit --audit-level=high
