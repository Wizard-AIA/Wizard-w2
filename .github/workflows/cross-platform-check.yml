name: "Cross-Platform Support Check"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same rationale as the main pipeline: no Docker sandbox, no model server and
  # no model download on these runners.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  check-support:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true

    # matplotlib's compiled extension needs the MSVC runtime on the hosted
    # Windows image; without this, importing it fails with
    # "DLL load failed while importing _c_internal_utils".
    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

    - name: Install backend dependencies
      # Hash-pinned (`uv pip compile --generate-hashes --universal`, see
      # requirements.txt's compile comment) so the same lock installs cleanly
      # on windows-latest and macos-latest, not just the linux runner ci.yml uses.
      run: uv pip install --system --require-hashes -r requirements.lock.txt

    - name: Run the test suite
      # No `|| echo` fallback here: a platform-specific failure has to fail the
      # job, otherwise this check reports success while proving nothing.
      run: pytest -q

    - name: Run sandbox containment selftest
      # Runs platform-specific sandbox containment tests (Windows Job Object / macOS SBPL)
      env:
        WIZARD_SANDBOX_SELFTEST: "1"
      run: pytest backend/tests/sandbox/ -v

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      with:
        package_json_file: frontend/package.json

    - name: Set up Node.js 20
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit
