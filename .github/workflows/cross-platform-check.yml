name: "Cross-Platform Support Check"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same rationale as the main pipeline: no Docker sandbox, no model server and
  # no model download on these runners.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  check-support:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true

    # matplotlib's compiled extension needs the MSVC runtime on the hosted
    # Windows image; without this, importing it fails with
    # "DLL load failed while importing _c_internal_utils".
    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

    - name: Install backend dependencies
      # Hash-pinned (`uv pip compile --generate-hashes --universal`, see
      # requirements.txt's compile comment) so the same lock installs cleanly
      # on windows-latest and macos-latest, not just the linux runner ci.yml uses.
      run: uv pip install --system --require-hashes -r requirements.lock.txt

    - name: Run the test suite
      # No `|| echo` fallback here: a platform-specific failure has to fail the
      # job, otherwise this check reports success while proving nothing.
      run: pytest -q

    - name: Set up pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
      with:
        package_json_file: frontend/package.json

    - name: Set up Node.js 20
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit
