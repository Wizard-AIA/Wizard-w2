name: Multi-OS Clean Packaging & Distribution

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Clean Install Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies in clean environment
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Test Core Engine Boot in Clean Environment
        run: |
          python -c "import sys; print(f'Wizard runtime booted successfully on {sys.platform}')"
          pytest backend/tests/unit/test_analysis_tools.py -v
