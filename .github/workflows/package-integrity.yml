name: Multi-OS Clean Packaging & Distribution

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-integrity:
    name: "Clean Install Verification (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Clean Install from requirements.txt
        run: |
          uv pip install --system -r requirements.txt -r requirements-local.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Verify Core Module Imports
        run: |
          python -c "from src.core.security.code_guard import CodeGuard; print('CodeGuard OK')"
          python -c "from src.core.execution import CodeExecutor; print('CodeExecutor OK')"
          python -c "from src.core.connectors.spec import ConnectionSpec; print('ConnectionSpec OK')"
          python -c "import numpy, pandas, pyarrow; print('Core deps OK')"
        working-directory: backend

      - name: Verify All Tests Collect Successfully
        run: |
          pytest backend/tests/unit/ --co -q --timeout=60

      - name: Run Core Unit Tests
        run: |
          pytest backend/tests/unit/ -v --timeout=120
