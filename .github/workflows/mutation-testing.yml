name: Mutation Testing (backend)

# Report-only, not a merge gate: a fresh baseline survival rate has not been
# established across the whole backend yet, and a mutant timing out under CI
# noise is not the same claim as a real gap in the suite. See
# docs/analysis/mutation-testing.md.
#
# Not run per-PR. A scoped run against two files (587 lines) already produced
# 514 mutants, and cosmic-ray re-runs the full pytest suite once per mutant --
# extrapolated across all of backend/src (~23k mutants measured), a single
# sequential pass is on the order of a day even though each mutant only costs
# a few seconds. Splitting the file list into parallel shards (see
# scripts/mutation_testing/plan_shards.py) is what makes this finish at all;
# weekly + on-demand is what makes it affordable to run this way regardless.
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      shards:
        description: "How many parallel shards to split backend/src across"
        required: false
        default: "20"
      roots:
        description: "Space-separated roots to scan"
        required: false
        default: "backend/src"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Same as ci.yml's backend job: no Docker-in-Docker sandbox, no model
  # server, no sentence-transformer download reachable from a runner.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Plan
        id: plan
        run: |
          python scripts/mutation_testing/plan_shards.py \
            --roots ${{ github.event.inputs.roots || 'backend/src' }} \
            --shards ${{ github.event.inputs.shards || '20' }} > shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"

  mutate:
    name: Shard ${{ matrix.shard.index }}
    needs: plan
    runs-on: ubuntu-latest
    # Generous on purpose: each mutant re-runs the full backend suite, and a
    # shard's size is balanced by file *size* (plan_shards.py), a proxy for
    # mutant count, not a guarantee -- some slack against an uneven shard is
    # cheaper than a shard that times out and reports nothing.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # Same two lock files as ci.yml's backend job -- cosmic-ray itself is
        # pinned in requirements-ci-tools.lock.txt. requirements-local.txt
        # (the analysis toolkit) is not needed: the suite runs in-process,
        # same as it does in ci.yml.
        run: |
          uv pip install --system --require-hashes -r requirements.lock.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Render this shard's cosmic-ray config
        run: |
          python scripts/mutation_testing/render_shard_config.py \
            --files-json '${{ toJSON(matrix.shard.files) }}' \
            --out cosmic-ray.shard.toml

      - name: Confirm the unmutated suite passes
        run: cosmic-ray baseline cosmic-ray.shard.toml

      - name: Discover mutants
        run: cosmic-ray init cosmic-ray.shard.toml session.sqlite

      - name: Mutate and test
        run: cosmic-ray exec cosmic-ray.shard.toml session.sqlite

      - name: Upload shard session
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-session-${{ matrix.shard.index }}
          path: session.sqlite
          retention-days: 14

  report:
    name: Merge and report
    needs: mutate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install cosmic-ray
        run: uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Download every shard's session
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-session-*
          path: shards
          merge-multiple: false

      - name: Merge shard sessions
        run: |
          python scripts/mutation_testing/merge_sessions.py \
            --out mutation-report.sqlite \
            shards/*/session.sqlite

      - name: Write step summary
        run: |
          python scripts/mutation_testing/write_summary.py mutation-report.sqlite --out summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render full HTML/text reports
        run: |
          cr-html mutation-report.sqlite > mutation-report.html
          cr-report --surviving-only mutation-report.sqlite > survived-mutants.txt

      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutation-report.sqlite
            mutation-report.html
            survived-mutants.txt
            summary.md
          retention-days: 90
