name: Full-Stack E2E Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-lifecycle:
    name: Headless ReAct Stream & Arrow IPC E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system --require-hashes -r requirements.lock.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Run Full-Stack Lifecycle E2E Tests
        run: pytest backend/tests/integration/test_full_stack_lifecycle.py -v
