name: OpenAPI & TypeScript Contract Drift

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-sync:
    name: Schema & Type Synchronization Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv pip install --system --require-hashes -r requirements.lock.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI Schema from Backend
        run: |
          PYTHONPATH=backend python -c "import json; from src.api.api import app; open('backend/openapi.json', 'w').write(json.dumps(app.openapi(), indent=2))"

      - name: Generate TypeScript API Types
        working-directory: frontend
        run: pnpm run generate:api-types

      - name: Verify Zero Contract Drift
        run: |
          git diff --exit-code frontend/lib/api-types.generated.ts || (echo "❌ Backend and Frontend contract drift detected! Please run 'pnpm run generate:api-types' and commit the updated types." && exit 1)
