name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner has no Docker-in-Docker sandbox and no model server, and it must
  # not download a sentence-transformer on every run. The suite is designed to
  # pass with all three unavailable.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true

    - name: Install dependencies
      # Both lock files are hash-pinned (`uv pip compile --generate-hashes`,
      # see the .in files) and requirements-ci-tools.lock.txt is compiled
      # *constrained* against requirements.lock.txt, so pytest-cov cannot drag
      # pytest to a version the rest of the suite was never run against.
      # SQLAlchemy -- what lets the relational connector be exercised against a
      # real database (SQLite, no server, no network); without it every
      # connector test skips -- arrives transitively via langchain and is
      # already pinned in requirements.lock.txt. `--system`: no venv here, just
      # the runner's own Python, same as the bare `pip install` this replaced.
      run: |
        uv pip install --system --require-hashes -r requirements.lock.txt
        uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

    - name: Lint
      run: |
        ruff check .
        ruff format --check .

    - name: Test
      # Run from the repo root: pyproject sets testpaths and pythonpath.
      run: pytest --cov=backend/src --cov-report=xml --cov-report=term-missing

    - name: Run sandbox containment selftest
      # Runs kernel-level containment tests (seccomp BPF / Landlock on Linux)
      env:
        WIZARD_SANDBOX_SELFTEST: "1"
      run: pytest backend/tests/sandbox/ -v

    - name: Upload coverage
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
      with:
        package_json_file: frontend/package.json

    - name: Set up Node.js 20
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: pnpm build

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

    - name: Build backend image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: wizard-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build sandbox image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./backend/docker
        file: backend/docker/Dockerfile
        push: false
        tags: wizard-sandbox:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false
        tags: wizard-frontend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
