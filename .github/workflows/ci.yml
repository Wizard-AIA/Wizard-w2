name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner has no Docker-in-Docker sandbox and no model server, and it must
  # not download a sentence-transformer on every run. The suite is designed to
  # pass with all three unavailable.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true

    - name: Install dependencies
      # Both lock files are hash-pinned (`uv pip compile --generate-hashes`,
      # see the .in files) and requirements-ci-tools.lock.txt is compiled
      # *constrained* against requirements.lock.txt, so pytest-cov cannot drag
      # pytest to a version the rest of the suite was never run against.
      # SQLAlchemy -- what lets the relational connector be exercised against a
      # real database (SQLite, no server, no network); without it every
      # connector test skips -- arrives transitively via langchain and is
      # already pinned in requirements.lock.txt. `--system`: no venv here, just
      # the runner's own Python, same as the bare `pip install` this replaced.
      run: |
        uv pip install --system --require-hashes -r requirements.lock.txt
        uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

    - name: Lint
      run: |
        ruff check .
        ruff format --check .

    - name: Test
      # Run from the repo root: pyproject sets testpaths and pythonpath.
      run: pytest --cov=backend/src --cov-report=xml --cov-report=term-missing

    - name: Run sandbox containment selftest
      # Runs kernel-level containment tests (seccomp BPF / Landlock on Linux)
      env:
        WIZARD_SANDBOX_SELFTEST: "1"
      run: pytest backend/tests/sandbox/ -v

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      with:
        package_json_file: frontend/package.json

    - name: Set up Node.js 20
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: pnpm build

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - name: Build backend image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: Dockerfile
        push: false
        tags: wizard-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build sandbox image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: ./backend/docker
        file: backend/docker/Dockerfile
        push: false
        tags: wizard-sandbox:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false
        tags: wizard-frontend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
