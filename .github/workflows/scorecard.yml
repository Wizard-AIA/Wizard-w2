name: OSSF Scorecard

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '30 3 * * 1' # weekly — score drifts as dependencies/branch rules change, not just on push
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload SARIF to code scanning
      id-token: write        # to publish results and get a badge from api.securityscorecards.dev
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          sarif_file: results.sarif
