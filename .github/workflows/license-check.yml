name: License Check

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check License Compliance
        uses: Telefonica/check-license-compliance@28fe1d4ed203133b0826da7fa14e8700d5675441  # v3.1.1
