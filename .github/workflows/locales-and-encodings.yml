name: International Locales & Collation Matrix

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locales:
    name: Locale ${{ matrix.locale }} (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: "it_IT.utf8"
            name: "Italian (Comma decimal)"
            pkg: "language-pack-it"
          - locale: "de_DE.utf8"
            name: "German (DD.MM.YYYY dates)"
            pkg: "language-pack-de"
          - locale: "zh_CN.utf8"
            name: "Chinese (Multibyte Hanzi)"
            pkg: "language-pack-zh-hans"
          - locale: "ja_JP.utf8"
            name: "Japanese (Kanji & Kana)"
            pkg: "language-pack-ja"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install System Locale Package
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ matrix.pkg }} locales
          sudo locale-gen ${{ matrix.locale }}
          sudo update-locale

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@16999be61f5b61e2f7b8893d56e18f2d591ffcb7  # v4.0.0

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt -r requirements-local.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Run Locale & Encoding Validation Suite
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}
        run: |
          pytest backend/tests/stress/test_locales_encodings.py -v
