name: International Locales & Collation Matrix

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locale-matrix:
    name: "Locale ${{ matrix.locale }} (${{ matrix.label }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: it_IT.utf8
            label: "Italian (Comma decimal)"
          - locale: de_DE.utf8
            label: "German (DD.MM.YYYY dates)"
          - locale: ja_JP.utf8
            label: "Japanese (Kanji & Kana)"
          - locale: zh_CN.utf8
            label: "Chinese (Multibyte Hanzi)"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system locale packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq locales
          sudo locale-gen ${{ matrix.locale }}
          sudo update-locale LANG=${{ matrix.locale }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt -r requirements-local.txt
          uv pip install --system --require-hashes -r requirements-ci-tools.lock.txt

      - name: Run Locale & Encoding Tests under ${{ matrix.locale }}
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}
        run: |
          pytest backend/tests/stress/test_locales_encodings.py -v -s
