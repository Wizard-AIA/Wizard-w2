services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Overrides the image's non-root user: creating sandbox containers requires
    # access to the mounted Docker socket, which is root-owned on the host. The
    # socket mount below already grants host-root-equivalent power, so dropping
    # to a non-root user here would add no real isolation.
    user: root
    # Prevents the container from ever regaining privileges beyond what it was
    # started with (e.g. via a setuid binary reachable through the mounted
    # socket path). Does not reduce the socket mount's own power -- that is
    # tracked above -- but it closes the one privilege-escalation avenue this
    # service can be hardened against without breaking Docker-socket access.
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=${APP_NAME:-Wizard}
      - ENV=${ENV:-prod}
      # auto measures the container's own cores and memory ceiling and sizes
      # thread count, sandbox memory and the session cap from them. Name a
      # profile (laptop | server | hpc) to pin it instead.
      - SYSTEM_PROFILE=${SYSTEM_PROFILE:-auto}
      - API_PROVIDER=${API_PROVIDER:-ollama}
      # Empty means "use whatever this provider has installed", discovered at
      # runtime. Set one to pin it. Hardcoding a tag here made two specific
      # Ollama models load-bearing, and neither exists on LM Studio or a gateway.
      - MODEL_NAME=${MODEL_NAME:-}
      - WORKER_MODEL_NAME=${WORKER_MODEL_NAME:-}
      - VISION_MODEL_NAME=${VISION_MODEL_NAME:-}
      # auto | compact | balanced | full — sizes the agent's iteration budget to
      # the model behind it. auto infers it from the model's parameter count.
      - AGENT_TIER=${AGENT_TIER:-auto}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # LM Studio serves loopback only until "Serve on Local Network" is enabled,
      # so this address is unreachable from the container until you turn that on.
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-}
      - PLOT_FORMAT=${PLOT_FORMAT:-html}
      # Restrict to the frontend origin. A wildcard here would also disable
      # credentialed requests, which browsers reject outright.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      # Set to require X-API-Key on mutating routes. Empty means open, which is
      # the right default for a local-only deployment.
      - API_KEY=${API_KEY:-}
      # Empty by default: the in-process queue and cache need no extra service.
      - REDIS_URL=${REDIS_URL:-}
      # host | docker | inprocess. `host` is the default everywhere else, but a
      # compose deployment mounts the Docker socket on purpose -- that mount is
      # the opt-in -- and the sandbox image carries the full analysis toolkit
      # that this backend image deliberately does not. Set `host` to run
      # generated code in a subprocess of this container instead.
      - EXECUTION_BACKEND=${EXECUTION_BACKEND:-docker}
      # core | standard | full — how much of the analysis toolkit the sandbox
      # image installs. The runtime reports what it has, so a smaller tier
      # advertises less rather than promising a missing library.
      - SANDBOX_TIER=${SANDBOX_TIER:-standard}
      - SANDBOX_NETWORK_DISABLED=${SANDBOX_NETWORK_DISABLED:-True}
      - SANDBOX_DOCKER_RUNTIME=${SANDBOX_DOCKER_RUNTIME:-}
      # Unset by default: derived from the memory this container is allowed.
      - SANDBOX_MEM_LIMIT=${SANDBOX_MEM_LIMIT:-}
    volumes:
      - ./backend:/app
      - ./workspace:/workspace
      # Required: the backend asks the host daemon to create sandbox containers.
      # This grants host-root-equivalent access, so only expose this service on
      # a trusted network.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Lets the backend reach a host-installed Ollama on Linux, where
      # host.docker.internal is not provided automatically.
      - "host.docker.internal:host-gateway"
    networks:
      - wizard_net
    restart: unless-stopped
    healthcheck:
      # The image carries no curl — the interpreter is already there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_started
    networks:
      - wizard_net
    restart: unless-stopped
    healthcheck:
      # node:20-alpine ships busybox wget; no curl in this image.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Opt-in: `docker compose --profile redis up`, with REDIS_URL set on the
  # backend. Without this the app runs entirely in-process.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - wizard_net
    restart: unless-stopped

networks:
  wizard_net:
    driver: bridge
